[project]
name = "supportpilot-backend"
version = "0.1.0"
description = "SupportPilot FastAPI backend (portfolio demo)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.135.3",
    "starlette==0.52.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "uvicorn==0.52.4",
    "sqlalchemy==2.0.55",
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "psycopg[binary]==3.2.13",
    "pgvector==0.4.2",
    "email-validator==2.3.0",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "pypdf==6.18.1",
    "markdown==3.10.3",
    "trafilatura==2.0.0",
    "openai==2.54.0",
    "python-multipart==0.0.22",
    "langgraph==1.0.10",
    "langgraph-prebuilt==1.0.13",
    "langgraph-sdk==0.3.15",
    "langgraph-checkpoint==4.0.3",
    "langgraph-checkpoint-postgres==3.0.5",
    "langchain-core==1.5.6",
    "langchain-openai==1.4.3",
    "psycopg-pool==3.2.8",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "ruff==0.15.22",
    "mypy==1.20.2",
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "respx==0.22.0",
    "types-pyyaml==6.0.12.20250915",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI idiom: Depends()/Query() in defaults is intentional.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = [
    "pgvector",
    "pgvector.*",
    "trafilatura",
    "trafilatura.*",
    "pypdf",
    "pypdf.*",
    "markdown",
    "markdown.*",
    "langgraph.*",
    "langchain_openai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
