[project]
name = "supportpilot-backend"
version = "0.1.0"
description = "SupportPilot FastAPI backend (portfolio demo)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.135.3",
    "starlette==0.52.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "ruff==0.15.22",
    "mypy==1.20.2",
    "pytest==8.4.2",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
